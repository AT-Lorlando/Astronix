<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <style>.l{fill:#0B1F3A}.s{fill:#D49A2A}@media (prefers-color-scheme:dark){.l{fill:#fff}}</style>
  <defs>
    <clipPath id="astx-front">
      <rect x="-220" y="0" width="440" height="220" />
    </clipPath>
    <clipPath id="astx-back">
      <rect x="-220" y="-220" width="440" height="221" />
    </clipPath>
    <clipPath id="astx-leftHalf">
      <rect x="0" y="0" width="200" height="400" />
    </clipPath>
    <clipPath id="astx-rightHalf">
      <rect x="200" y="0" width="200" height="400" />
    </clipPath>
    <mask id="astx-cutLeft" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <rect width="400" height="400" fill="#fff" />
      <g transform="translate(200 180) rotate(-24)" clip-path="url(#astx-front)" fill="#000">
        <path clip-path="url(#astx-leftHalf)" fill-rule="evenodd"
          d="M-157,0 a157,59 0 1 0 314,0 a157,59 0 1 0 -314,0 Z M-132,-3 a132,36 0 1 0 264,0 a132,36 0 1 0 -264,0 Z" />
      </g>
    </mask>
    <mask id="astx-cutRight" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <rect width="400" height="400" fill="#fff" />
      <g transform="translate(200 180) rotate(-24)" clip-path="url(#astx-front)" fill="#000">
        <path clip-path="url(#astx-front)" fill-rule="evenodd"
          d="M-157,0 a157,59 0 1 0 314,0 a157,59 0 1 0 -314,0 Z M-136,-3 a136,36 0 1 0 264,0 a132,36 0 1 0 -264,0 Z" />
      </g>
    </mask>
    <mask id="astx-cutRing" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <rect width="400" height="400" fill="#fff" />
      <circle cx="286" cy="107" r="15" fill="#000" />
    </mask>
  </defs>

  <!-- anneau : partie arrière -->
  <g class="l" mask="url(#astx-cutRing)">
    <g transform="translate(200 180) rotate(-24)" clip-path="url(#astx-back)">
      <path fill-rule="evenodd"
        d="M-150,0 a150,52 0 1 0 300,0 a150,52 0 1 0 -300,0 Z M-139,-3 a139,43 0 1 0 278,0 a132,43 0 1 0 -278,0 Z" />
    </g>
  </g>
  <!-- lettre A -->
  <g class="l">
    <polygon points="184,60 216,60 313,320 274,320 200,111" mask="url(#astx-cutLeft)" />
    <polygon points="184,60 216,60 126,320 87,320" mask="url(#astx-cutRight)" />
  </g>
  <!-- anneau : partie avant -->
  <g class="l">
    <g transform="translate(200 180) rotate(-24)" clip-path="url(#astx-front)">
      <path fill-rule="evenodd"
        d="M-150,0 a150,52 0 1 0 300,0 a150,52 0 1 0 -300,0 Z M-139,-3 a139,43 0 1 0 278,0 a139,43 0 1 0 -278,0 Z" />
    </g>
  </g>
  <!-- étoile -->
  <g class="s" transform="translate(286 107) rotate(-45)">
    <path d="M0,-18 C0,-4 4,0 18,0 C4,0 0,4 0,18 C0,4 -4,0 -18,0 C-4,0 0,-4 0,-18 Z" />
  </g>
</svg>